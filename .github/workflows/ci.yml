name: CI

on:
  push:
    branches:
      - main
      - 'beargare/**'
      - 'cursor/**'
  pull_request:

jobs:
  check:
    name: sensitive · glossary · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:sensitive
      - run: npm run check:glossary
      - run: npm run build
